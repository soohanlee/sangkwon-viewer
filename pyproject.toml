[project]
name = "sangkwon-collector"
version = "0.1.0"
description = "상권분석 데이터 수집기 - 공공 API에서 수요/경쟁/비용 데이터를 모아 SQLite에 적재하고 JSON/CSV로 내보낸다"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "tenacity>=8.2",
]

[project.scripts]
sangkwon = "sangkwon.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sangkwon"]
