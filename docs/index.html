<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>상권분석 공개데이터 뷰어 (데모)</title>
<style>
  :root{
    --bg:#0f1420; --panel:#171e2e; --panel2:#1e2740; --line:#2a3450;
    --txt:#e7ecf5; --muted:#93a0bd; --accent:#5b8cff; --accent2:#3ad29f;
    --chip:#243050;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Malgun Gothic",sans-serif;line-height:1.5}
  header{padding:28px 24px 18px;border-bottom:1px solid var(--line);
    background:linear-gradient(180deg,#141b2c,#0f1420)}
  .wrap{max-width:1180px;margin:0 auto;padding:0 20px}
  h1{margin:0;font-size:22px;letter-spacing:-.3px}
  .sub{color:var(--muted);font-size:13.5px;margin-top:6px}
  .badge{display:inline-block;background:var(--chip);color:var(--accent2);
    font-size:11.5px;padding:3px 9px;border-radius:20px;margin-left:8px;vertical-align:middle}
  .note{background:#1a2439;border:1px solid var(--line);border-radius:10px;
    padding:12px 14px;margin:18px 0;color:var(--muted);font-size:13px}
  .note b{color:var(--txt)}
  section{margin:26px 0}
  .sec-title{font-size:15px;font-weight:600;margin:0 0 12px;color:var(--txt)}
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
  .card .ic{font-size:20px}
  .card .lbl{font-size:13px;color:var(--muted);margin-top:6px}
  .card .num{font-size:24px;font-weight:700;letter-spacing:-.5px}
  .card .src{font-size:11px;color:var(--accent);margin-top:6px}
  .bars{display:flex;flex-direction:column;gap:7px}
  .bar-row{display:grid;grid-template-columns:120px 1fr 74px;align-items:center;gap:10px;font-size:12.5px}
  .bar-row .name{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bar{height:16px;background:linear-gradient(90deg,var(--accent),#8ab0ff);border-radius:5px;min-width:3px}
  .bar.g{background:linear-gradient(90deg,var(--accent2),#7ff0c8)}
  .bar-row .val{text-align:right;color:var(--txt);font-variant-numeric:tabular-nums}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:22px}
  @media(max-width:760px){.two{grid-template-columns:1fr}.bar-row{grid-template-columns:96px 1fr 64px}}
  .tabs{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px}
  .tab{background:var(--panel);border:1px solid var(--line);color:var(--muted);
    padding:8px 13px;border-radius:9px;cursor:pointer;font-size:13px}
  .tab:hover{border-color:var(--accent)}
  .tab.active{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
  .tab .cnt{opacity:.75;font-size:11px;margin-left:5px}
  .tblhead{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:8px;margin-bottom:8px}
  .tblhead .src{color:var(--accent);font-size:12.5px}
  .tblhead .meta{color:var(--muted);font-size:12.5px}
  .tablescroll{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
  table{border-collapse:collapse;width:100%;font-size:12.5px;white-space:nowrap}
  th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line)}
  th{background:var(--panel2);color:var(--muted);font-weight:600;position:sticky;top:0}
  tr:last-child td{border-bottom:none}
  tbody tr:hover{background:#1a2338}
  td.num{text-align:right;font-variant-numeric:tabular-nums}
  footer{color:var(--muted);font-size:12px;text-align:center;padding:26px 0 40px}
  a{color:var(--accent)}
  .loading{color:var(--muted);padding:40px 0;text-align:center}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <h1>상권분석 공개데이터 뷰어 <span class="badge">DEMO · 샘플</span></h1>
    <div class="sub">공공 오픈 API로 수집한 상권 데이터의 <b style="color:var(--txt)">형태를 보여주는 미리보기</b>입니다. 전체 데이터가 아니라 테이블별 대표 샘플만 표시합니다.</div>
  </div>
</header>

<div class="wrap">
  <div class="note">
    📌 <b>이 사이트는 공개(오픈) 데이터만 보여줍니다.</b> 출처: 소상공인시장진흥공단 상가정보 · 국토교통부 실거래가 · 통계청 SGIS · 서울 열린데이터광장 골목상권.
    개인정보나 비공개 정보는 포함되지 않으며, 표시되는 건 전체 중 일부 샘플입니다.
  </div>

  <div id="app"><div class="loading">데이터 불러오는 중…</div></div>
</div>

<footer>
  상권분석 POC · 공개데이터 데모 뷰어 · <span id="gen"></span>
</footer>

<script>
const fmt = n => (typeof n==="number") ? n.toLocaleString("ko-KR") : (n??"");
const isNum = v => typeof v==="number";

fetch("./data/demo.json")
  .then(r=>r.json())
  .then(render)
  .catch(e=>{ document.getElementById("app").innerHTML =
    '<div class="loading">데이터를 불러오지 못했습니다. data/demo.json 위치를 확인하세요.<br>'+e+'</div>'; });

let DATA=null, active=null;

function render(d){
  DATA=d; active=d.tables[0]?.name;
  document.getElementById("gen").textContent = "생성일 "+d.generated_at;
  const s=d.summary;
  const maxR=Math.max(1,...s.by_region.map(x=>x.count));
  const maxI=Math.max(1,...s.by_industry.map(x=>x.count));

  const cards = s.cards.map(c=>`
    <div class="card"><div class="ic">${c.icon}</div>
      <div class="num">${fmt(c.total)}</div>
      <div class="lbl">${c.label}</div>
      <div class="src">${c.source}</div></div>`).join("");

  const regionBars = s.by_region.map(x=>`
    <div class="bar-row"><div class="name">${x.label}</div>
      <div class="bar" style="width:${x.count/maxR*100}%"></div>
      <div class="val">${fmt(x.count)}</div></div>`).join("");

  const indBars = s.by_industry.map(x=>`
    <div class="bar-row"><div class="name">${x.label}</div>
      <div class="bar g" style="width:${x.count/maxI*100}%"></div>
      <div class="val">${fmt(x.count)}</div></div>`).join("");

  const tabs = d.tables.map(t=>`
    <div class="tab${t.name===active?' active':''}" data-t="${t.name}">
      ${t.icon} ${t.label}<span class="cnt">${fmt(t.total)}</span></div>`).join("");

  document.getElementById("app").innerHTML = `
    <section>
      <div class="sec-title">전체 수집 현황 (실제 건수)</div>
      <div class="cards">${cards}</div>
    </section>
    <section class="two">
      <div><div class="sec-title">지역별 상가 분포</div><div class="bars">${regionBars}</div></div>
      <div><div class="sec-title">업종 대분류 TOP 10</div><div class="bars">${indBars}</div></div>
    </section>
    <section>
      <div class="sec-title">데이터 샘플 미리보기</div>
      <div class="tabs">${tabs}</div>
      <div id="tblbox"></div>
    </section>`;

  document.querySelectorAll(".tab").forEach(el=>
    el.onclick=()=>{active=el.dataset.t;
      document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("active",x.dataset.t===active));
      drawTable();});
  drawTable();
}

function drawTable(){
  const t=DATA.tables.find(x=>x.name===active);
  const head=t.columns.map(c=>`<th>${c.label}</th>`).join("");
  const body=t.rows.map(r=>"<tr>"+t.columns.map(c=>{
    const v=r[c.col];
    return `<td class="${isNum(v)?'num':''}">${isNum(v)?fmt(v):(v??"")}</td>`;
  }).join("")+"</tr>").join("");
  document.getElementById("tblbox").innerHTML = `
    <div class="tblhead">
      <div class="src">출처: ${t.source}</div>
      <div class="meta">전체 ${fmt(t.total)}건 중 샘플 ${t.sample_n}건 표시</div>
    </div>
    <div class="tablescroll"><table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>`;
}
</script>
</body>
</html>
